name: Pester

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pester-windows-powershell:
    name: Pester on Windows PowerShell 5.1
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Git and PowerShell versions
        shell: powershell
        run: |
          git --version
          $PSVersionTable | Format-List

      - name: Run Pester (with coverage)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Use the runner script so coverage behavior stays in one place
          # (single source of truth shared with local dev). Coverage is
          # collected only on the PS 5.1 leg - the PS 7 leg below is a
          # parity check that the same tests pass on both hosts and does
          # not need to duplicate the coverage report.
          .\tools\Run-GitEasyPester.ps1 -ProjectRoot . -Coverage -Quiet `
                                        -CoverageOutputPath '.\coverage.txt' `
                                        -ThisEditionOnly

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giteasy-coverage-txt
          path: coverage.txt
          if-no-files-found: warn

      - name: Public-surface jargon audit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\Audit-PublicJargon.ps1 -ProjectRoot .

      - name: PSScriptAnalyzer gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Set-PSRepository PSGallery -InstallationPolicy Trusted
              Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck
          }
          $r    = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          if ($r) { $r | Format-Table -AutoSize }
          $errs = @($r | Where-Object { $_.Severity -eq 'Error' })
          $warn = @($r | Where-Object { $_.Severity -eq 'Warning' })
          Write-Host "PSSA: $($errs.Count) error(s), $($warn.Count) warning(s)"
          if ($errs.Count -gt 0) { throw "PSScriptAnalyzer found $($errs.Count) error(s)." }

  pester-pwsh:
    name: Pester on PowerShell 7
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Git and PowerShell versions
        shell: pwsh
        run: |
          git --version
          $PSVersionTable | Format-List

      - name: Run Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\Run-GitEasyPester.ps1 -Quiet -ThisEditionOnly

      - name: PSScriptAnalyzer gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Set-PSRepository PSGallery -InstallationPolicy Trusted
              Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck
          }
          $r    = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          if ($r) { $r | Format-Table -AutoSize }
          $errs = @($r | Where-Object { $_.Severity -eq 'Error' })
          $warn = @($r | Where-Object { $_.Severity -eq 'Warning' })
          Write-Host "PSSA: $($errs.Count) error(s), $($warn.Count) warning(s)"
          if ($errs.Count -gt 0) { throw "PSScriptAnalyzer found $($errs.Count) error(s)." }
